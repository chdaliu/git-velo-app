<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}" data-lang="zh"
      data-title-zh="{{ site.title }} — {{ site.tagline }}"
      data-title-en="{{ site.title }} — {{ site.tagline_en }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }} — {{ site.tagline }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#0a0b10">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/appicon.svg' | relative_url }}">
  <link rel="alternate icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <meta property="og:image" content="{{ '/assets/img/appicon-512.png' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main" data-zh="跳到正文" data-en="Skip to content">跳到正文</a>
  {{ content }}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
